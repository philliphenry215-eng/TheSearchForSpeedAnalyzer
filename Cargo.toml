[package]
name = "search_for_speed_analyzer"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "SearchForSpeedAnalyzer"
path = "src/main.rs"

[dependencies]
eframe = "0.27.2"
egui = "0.27.2"
egui_extras = "0.27.2"
iracing = "0.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.24", default-features = false, features = ["png", "ico"] }
ureq = { version = "2.9", features = ["json"] }

[build-dependencies]
winres = "0.1"

